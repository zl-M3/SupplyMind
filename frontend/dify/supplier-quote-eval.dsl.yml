app:
  description: 上传供应商报价单 → 三列基准对比（比上次/比我在用价/比同行）+ 按品类质量档位 + 二维判定 + 模型归因与议价策略。数值全部由代码节点计算，模型只做解释。
  icon: 📊
  icon_background: '#FFEAD5'
  mode: workflow
  name: 供应商报价评估
  use_icon_as_answer_icon: false
kind: app
version: 0.1.5
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
      - data: {isInIteration: false, sourceType: start, targetType: document-extractor}
        id: e-start-doc
        source: start
        sourceHandle: source
        target: doc_extract
        targetHandle: target
      - data: {isInIteration: false, sourceType: document-extractor, targetType: llm}
        id: e-doc-llm1
        source: doc_extract
        sourceHandle: source
        target: llm_parse
        targetHandle: target
      - data: {isInIteration: false, sourceType: llm, targetType: code}
        id: e-llm1-code1
        source: llm_parse
        sourceHandle: source
        target: code_baseline
        targetHandle: target
      - data: {isInIteration: false, sourceType: code, targetType: code}
        id: e-code1-code2
        source: code_baseline
        sourceHandle: source
        target: code_grade
        targetHandle: target
      - data: {isInIteration: false, sourceType: code, targetType: code}
        id: e-code2-code3
        source: code_grade
        sourceHandle: source
        target: code_verdict
        targetHandle: target
      - data: {isInIteration: false, sourceType: code, targetType: llm}
        id: e-code3-llm2
        source: code_verdict
        sourceHandle: source
        target: llm_strategy
        targetHandle: target
      - data: {isInIteration: false, sourceType: llm, targetType: llm}
        id: e-llm2-llm3
        source: llm_strategy
        sourceHandle: source
        target: llm_report
        targetHandle: target
      - data: {isInIteration: false, sourceType: llm, targetType: end}
        id: e-llm3-end
        source: llm_report
        sourceHandle: source
        target: end
        targetHandle: target
    nodes:
      # ---------------- 1. 开始 ----------------
      - data:
          desc: 供应商报价评估入参
          selected: false
          title: 开始
          type: start
          variables:
            - label: 供应商ID
              max_length: 48
              options: []
              required: true
              type: text-input
              variable: supplier_id
            - label: 报价单
              allowed_file_extensions:
                - .csv
                - .xlsx
              allowed_file_types:
                - document
              allowed_file_upload_methods:
                - local_file
              required: true
              type: file
              variable: quote_file
            - label: 采购员备注
              max_length: 500
              options: []
              required: false
              type: paragraph
              variable: buyer_note
        height: 152
        id: start
        position: {x: 60, y: 320}
        type: custom
        width: 244

      # ---------------- 2. 文档提取 ----------------
      - data:
          desc: CSV/文件 → 纯文本
          is_array_file: false
          selected: false
          title: 报价单解析
          type: document-extractor
          variable_selector:
            - start
            - quote_file
        height: 60
        id: doc_extract
        position: {x: 360, y: 360}
        type: custom
        width: 244

      # ---------------- 3. LLM-1 结构化 ----------------
      - data:
          context:
            enabled: false
            variable_selector: []
          desc: 把报价表文本转成严格 JSON
          model:
            completion_params:
              temperature: 0
            mode: chat
            name: qwen-plus
            provider: langgenius/tongyi/tongyi
          prompt_template:
            - role: system
              text: |
                你是报价单解析器。你的唯一任务是把 CSV/表格文本转成严格 JSON。

                规则：
                1. 只输出 JSON，不要任何解释、不要 markdown 代码块。
                2. 商品编码统一转成大写并去掉空格，格式必须是 PRD-数字。
                3. 单价转成数字（去掉 ¥ 和千分位逗号）。无法识别的行放进 errors。
                4. 不要编造任何一行；文本里没有的商品绝对不要输出。
                5. 保留原始行号 row_no（从 1 开始，不含表头），便于回溯。

                输出格式：
                {
                  "rows": [
                    {"row_no": 1, "code": "PRD-001", "name": "五层瓦楞纸箱", "price": 4.35,
                     "currency": "CNY", "tax_included": true, "valid_until": "2026-12-31"}
                  ],
                  "errors": [
                    {"row_no": 5, "raw": "原始这一行的内容", "reason": "缺少商品编码"}
                  ]
                }
            - role: user
              text: |
                报价单原文：
                {{#doc_extract.text#}}
          selected: false
          title: LLM-1 报价结构化
          type: llm
          variables: []
          vision:
            enabled: false
        height: 98
        id: llm_parse
        position: {x: 660, y: 340}
        type: custom
        width: 244

      # ---------------- 4. 代码-1 校验与三列基准 ----------------
      - data:
          code: |
            import json

            # ============ 演示用基准数据 ============
            # 接后端时：换成 HTTP 请求节点的结果，下面的计算逻辑一行都不用改
            OUR_PRICE = {
                "PRD-001": 4.2, "PRD-002": 28.5, "PRD-003": 6.8, "PRD-004": 45.0,
                "PRD-005": 22.5, "PRD-006": 1.2, "PRD-007": 38.0, "PRD-008": 32.0,
                "PRD-009": 1.8, "PRD-010": 5.5, "PRD-011": 12.0, "PRD-012": 18.5,
            }
            LAST_PRICE = {
                "PRD-001": 4.0, "PRD-002": 27.0, "PRD-003": 6.5, "PRD-004": 44.0,
                "PRD-005": 22.0, "PRD-006": 1.25, "PRD-007": 37.0, "PRD-008": 31.0,
                "PRD-009": 1.75, "PRD-010": 5.4, "PRD-011": 11.8, "PRD-012": 18.0,
            }
            PEER_MIN = {
                "PRD-001": 3.95, "PRD-002": 26.8, "PRD-005": 21.8,
                "PRD-006": 1.18, "PRD-010": 5.2, "PRD-012": 17.6,
            }
            CATEGORY = {
                "PRD-001": "包装材料", "PRD-002": "包装材料", "PRD-003": "包装材料",
                "PRD-004": "日用百货", "PRD-005": "办公耗材", "PRD-006": "办公耗材",
                "PRD-007": "化工原料", "PRD-008": "劳保用品", "PRD-009": "包装材料",
                "PRD-010": "包装材料", "PRD-011": "包装材料", "PRD-012": "包装材料",
            }


            def _pct(new, old):
                if not old:
                    return None
                return round((new - old) / old, 4)


            def main(rows_json: str, supplier_id: str) -> dict:
                try:
                    payload = json.loads(rows_json)
                except Exception:
                    return {
                        "rows": "[]",
                        "errors": json.dumps([{"reason": "LLM 输出不是合法 JSON"}], ensure_ascii=False),
                        "stat": "{}",
                    }

                ok, bad = [], list(payload.get("errors") or [])

                for r in payload.get("rows") or []:
                    code = str(r.get("code") or "").strip().upper()
                    price = r.get("price")
                    row_no = r.get("row_no")

                    if code not in OUR_PRICE:
                        bad.append({"row_no": row_no, "code": code, "reason": "商品编码不在我方商品库"})
                        continue
                    try:
                        price = float(price)
                    except Exception:
                        bad.append({"row_no": row_no, "code": code, "reason": "单价无法解析"})
                        continue
                    if price <= 0:
                        bad.append({"row_no": row_no, "code": code, "reason": "单价必须大于 0"})
                        continue

                    our = OUR_PRICE[code]
                    last = LAST_PRICE.get(code)
                    peer = PEER_MIN.get(code)

                    ok.append({
                        "row_no": row_no,
                        "code": code,
                        "name": r.get("name"),
                        "category": CATEGORY.get(code, "未分类"),
                        "price": price,
                        "our_price": our,
                        "last_price": last,
                        "peer_min": peer,
                        "delta_vs_last": _pct(price, last),
                        "delta_vs_our": _pct(price, our),
                        "delta_vs_peer": _pct(price, peer),
                    })

                stat = {
                    "total": len(ok) + len(bad),
                    "valid": len(ok),
                    "rejected": len(bad),
                    "supplier_id": supplier_id,
                    "categories": sorted({x["category"] for x in ok}),
                }
                return {
                    "rows": json.dumps(ok, ensure_ascii=False),
                    "errors": json.dumps(bad, ensure_ascii=False),
                    "stat": json.dumps(stat, ensure_ascii=False),
                }
          code_language: python3
          desc: 校验商品编码 + 计算三列基准差额
          outputs:
            rows:
              children: null
              type: string
            errors:
              children: null
              type: string
            stat:
              children: null
              type: string
          selected: false
          title: 代码-1 校验与基准
          type: code
          variables:
            - value_selector: [llm_parse, text]
              variable: rows_json
            - value_selector: [start, supplier_id]
              variable: supplier_id
        height: 120
        id: code_baseline
        position: {x: 960, y: 320}
        type: custom
        width: 244

      # ---------------- 5. 代码-2 质量档位 ----------------
      - data:
          code: |
            import json

            # ============ 演示用质检记录 ============
            # 接后端时换成 HTTP 节点：GET /api/quality-records?supplier_id=&category=&limit=5
            QUALITY_RECORDS = [
                {"supplier_id": "SUP-001", "category": "包装材料", "batch": "B01", "inspected": 1000, "qualified": 998, "returned": 2, "complained": 0},
                {"supplier_id": "SUP-001", "category": "包装材料", "batch": "B02", "inspected": 800, "qualified": 796, "returned": 3, "complained": 0},
                {"supplier_id": "SUP-001", "category": "包装材料", "batch": "B03", "inspected": 1200, "qualified": 1196, "returned": 2, "complained": 1},
                {"supplier_id": "SUP-001", "category": "包装材料", "batch": "B04", "inspected": 900, "qualified": 897, "returned": 1, "complained": 0},
                {"supplier_id": "SUP-001", "category": "包装材料", "batch": "B05", "inspected": 1100, "qualified": 1094, "returned": 4, "complained": 0},
                {"supplier_id": "SUP-003", "category": "劳保用品", "batch": "C01", "inspected": 500, "qualified": 470, "returned": 18, "complained": 3},
                {"supplier_id": "SUP-003", "category": "劳保用品", "batch": "C02", "inspected": 600, "qualified": 561, "returned": 22, "complained": 4},
                {"supplier_id": "SUP-005", "category": "包装材料", "batch": "D01", "inspected": 400, "qualified": 398, "returned": 1, "complained": 0},
            ]

            WINDOW_BATCHES = 5
            MIN_SAMPLE = 2


            def main(supplier_id: str, stat: str) -> dict:
                try:
                    cats = (json.loads(stat) or {}).get("categories") or []
                except Exception:
                    cats = []

                grades = {}
                for cat in cats:
                    rs = [r for r in QUALITY_RECORDS
                          if r["supplier_id"] == supplier_id and r["category"] == cat]
                    rs = rs[-WINDOW_BATCHES:]

                    sample = len(rs)
                    if sample < MIN_SAMPLE:
                        grades[cat] = {"grade": "数据不足", "sample": sample, "rate": None,
                                       "reason": "最近质检批次不足 %d 批" % MIN_SAMPLE}
                        continue

                    inspected = sum(r["inspected"] for r in rs)
                    qualified = sum(r["qualified"] for r in rs)
                    returned = sum(r["returned"] for r in rs)
                    complained = sum(r["complained"] for r in rs)

                    rate = qualified / inspected if inspected else 0
                    ret_rate = returned / inspected if inspected else 0

                    if rate >= 0.995:
                        grade = "A"
                    elif rate >= 0.985:
                        grade = "B"
                    elif rate >= 0.96:
                        grade = "C"
                    else:
                        grade = "D"

                    if ret_rate > 0.01 or complained >= 2:
                        grade = {"A": "B", "B": "C", "C": "D", "D": "D"}[grade]

                    grades[cat] = {
                        "grade": grade,
                        "sample": sample,
                        "rate": round(rate, 4),
                        "return_rate": round(ret_rate, 4),
                        "complaints": complained,
                    }

                return {"grades": json.dumps(grades, ensure_ascii=False)}
          code_language: python3
          desc: 供应商 × 品类，取最近 5 批质检记录分 A/B/C/D
          outputs:
            grades:
              children: null
              type: string
          selected: false
          title: 代码-2 质量档位
          type: code
          variables:
            - value_selector: [start, supplier_id]
              variable: supplier_id
            - value_selector: [code_baseline, stat]
              variable: stat
        height: 120
        id: code_grade
        position: {x: 1260, y: 320}
        type: custom
        width: 244

      # ---------------- 6. 代码-3 二维判定与锚点 ----------------
      - data:
          code: |
            import json

            # 二维判定矩阵：价格档 × 质量档
            MATRIX = {
                "down":  {"A": "直接接受", "B": "直接接受", "C": "小议", "D": "必须议价", "数据不足": "直接接受"},
                "flat":  {"A": "直接接受", "B": "直接接受", "C": "小议", "D": "必须议价", "数据不足": "直接接受"},
                "up":    {"A": "直接接受", "B": "小议", "C": "必须议价", "D": "必须议价", "数据不足": "小议"},
                "bigup": {"A": "小议", "B": "必须议价", "C": "必须议价", "D": "建议换供应商", "数据不足": "必须议价"},
            }

            OPEN_RATE = 0.95
            FLOOR_RATE = 0.97


            def bucket_of(delta):
                if delta is None:
                    return "flat"
                if delta <= 0:
                    return "down"
                if delta <= 0.05:
                    return "flat"
                if delta <= 0.10:
                    return "up"
                return "bigup"


            def median(vals):
                vals = sorted(vals)
                n = len(vals)
                if n == 0:
                    return None
                return vals[n // 2] if n % 2 == 1 else (vals[n // 2 - 1] + vals[n // 2]) / 2


            def main(rows: str, grades: str) -> dict:
                rows = json.loads(rows or "[]")
                grades = json.loads(grades or "{}")

                out = []
                for r in rows:
                    cat = r.get("category")
                    g = (grades.get(cat) or {}).get("grade", "数据不足")
                    b = bucket_of(r.get("delta_vs_last"))
                    verdict = MATRIX[b][g]

                    cands = [x for x in [r.get("last_price"), r.get("our_price"), r.get("peer_min")] if x]
                    anchor = round(median(cands), 2) if cands else round(r["price"], 2)

                    out.append({
                        **r,
                        "grade": g,
                        "price_bucket": b,
                        "verdict": verdict,
                        "anchor_price": anchor,
                        "open_price": round(anchor * OPEN_RATE, 2),
                        "floor_price": round(anchor * FLOOR_RATE, 2),
                        "quality_note": "本行未参与质量联动（样本不足）" if g == "数据不足" else "",
                    })

                histogram = {}
                for r in out:
                    histogram[r["verdict"]] = histogram.get(r["verdict"], 0) + 1

                summary = {
                    "valid_rows": len(out),
                    "by_verdict": histogram,
                    "need_negotiation": sum(v for k, v in histogram.items() if k in ("必须议价", "建议换供应商")),
                    "total_amount_now": round(sum(r["price"] for r in out), 2),
                    "total_amount_anchor": round(sum(r["anchor_price"] for r in out), 2),
                }

                return {
                    "rows_with_verdict": json.dumps(out, ensure_ascii=False),
                    "summary": json.dumps(summary, ensure_ascii=False),
                }
          code_language: python3
          desc: 二维矩阵判定 + 计算锚点/先报价/底线价
          outputs:
            rows_with_verdict:
              children: null
              type: string
            summary:
              children: null
              type: string
          selected: false
          title: 代码-3 判定与锚点
          type: code
          variables:
            - value_selector: [code_baseline, rows]
              variable: rows
            - value_selector: [code_grade, grades]
              variable: grades
        height: 120
        id: code_verdict
        position: {x: 1560, y: 320}
        type: custom
        width: 244

      # ---------------- 7. LLM-2 归因与议价策略 ----------------
      - data:
          context:
            enabled: false
            variable_selector: []
          desc: 只做归因与策略，不改任何数字
          model:
            completion_params:
              temperature: 0.2
            mode: chat
            name: qwen-plus
            provider: langgenius/tongyi/tongyi
          prompt_template:
            - role: system
              text: |
                你是资深采购谈判顾问。数据已经由系统算好，你只做三件事，绝不重新算数。

                【你可以做的】
                1. 归因：解释异常行可能的原因（原材料涨价 / 规格变化 / 汇率 / 报价口径从含税变不含税 / 数量差异等）
                2. 挑选：从全部行里挑出最值得优先谈的 3～5 行
                3. 给策略：每行给「先报价 / 底线价 / 一句话理由」

                【你绝对不能做的】
                - 不能修改任何数字（price / anchor_price / open_price / floor_price 原样引用）
                - 不能编造数据里没有的商品或商品编码
                - 不能断言数据之外的因果（没依据就说"推测"）

                【输出格式】严格 JSON，不要 markdown 代码块：
                {
                  "headline": "一句话总体判断",
                  "priority_rows": [
                    {"code": "PRD-002", "why": "归因，必须引用具体数字",
                     "open_price": 26.8, "floor_price": 27.4, "talking_point": "一句话话术"}
                  ],
                  "quality_risk": "质量风险提示，无则填 null",
                  "rejected_rows_note": "被拒行说明，无则填 null"
                }
            - role: user
              text: |
                供应商：{{#start.supplier_id#}}
                采购员备注：{{#start.buyer_note#}}

                逐行判定结果（已算好，直接引用）：
                {{#code_verdict.rows_with_verdict#}}

                汇总：
                {{#code_verdict.summary#}}

                被拒绝的行：
                {{#code_baseline.errors#}}
          selected: false
          title: LLM-2 归因与议价策略
          type: llm
          variables: []
          vision:
            enabled: false
        height: 98
        id: llm_strategy
        position: {x: 1860, y: 330}
        type: custom
        width: 244

      # ---------------- 8. LLM-3 生成报告 ----------------
      - data:
          context:
            enabled: false
            variable_selector: []
          desc: 输出结构化 Markdown 报告
          model:
            completion_params:
              temperature: 0.3
            mode: chat
            name: qwen-plus
            provider: langgenius/tongyi/tongyi
          prompt_template:
            - role: system
              text: |
                你是采购分析报告撰写者。把已有结论整理成一份中文 Markdown 报告。

                结构固定：
                ## 一、结论摘要
                （3 行以内，含：本次报价总体涨跌、需议价行数、质量风险）

                ## 二、三列基准对比
                Markdown 表格，列：商品编码 | 商品名 | 本次报价 | 比上次报价 | 比我在用价 | 比同行最低 | 质量档 | 判定
                - 百分比保留一位小数，涨用 ↑，跌用 ↓
                - 数据为 null 的填 "—"

                ## 三、优先议价清单
                （逐行：商品 + 锚点/先报/底线 + 理由）

                ## 四、质量风险
                （按品类列档位与样本量；标出"数据不足"的品类）

                ## 五、异常与拒收行
                （列出未通过校验的行及原因）

                要求：不要编造数字；表格里的每个数字都必须来自输入。
            - role: user
              text: |
                统计：{{#code_baseline.stat#}}
                质量档位：{{#code_grade.grades#}}
                逐行明细：{{#code_verdict.rows_with_verdict#}}
                汇总：{{#code_verdict.summary#}}
                归因与策略：{{#llm_strategy.text#}}
          selected: false
          title: LLM-3 生成报告
          type: llm
          variables: []
          vision:
            enabled: false
        height: 98
        id: llm_report
        position: {x: 2160, y: 330}
        type: custom
        width: 244

      # ---------------- 9. 结束 ----------------
      - data:
          desc: 输出报告与明细
          outputs:
            - value_selector: [llm_report, text]
              variable: report
            - value_selector: [code_verdict, rows_with_verdict]
              variable: detail_json
            - value_selector: [code_verdict, summary]
              variable: summary
            - value_selector: [code_baseline, errors]
              variable: rejected
          selected: false
          title: 结束
          type: end
        height: 120
        id: end
        position: {x: 2460, y: 320}
        type: custom
        width: 244
  rag_pipeline_variables: []
